# Dependabot: wöchentliche Updates, gebündelt, damit wenige PRs entstehen.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      npm:
        patterns: ["*"]
    # Große Versionssprünge (Major) nicht automatisch: Sie brechen Builds (zum Beispiel Express 5,
    # TypeScript 7, Next 16). Die macht Manuel bewusst von Hand.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
