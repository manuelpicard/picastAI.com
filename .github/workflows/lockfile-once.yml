# Einmaliger Helfer: in der Entwicklungsumgebung ist die npm-Registry nicht erreichbar.
# Aktualisiert Abhängigkeiten, erzeugt package-lock.json, prüft und committet auf diesen Branch.
# Wird im nächsten Commit wieder entfernt.
name: Lockfile einmalig erzeugen

on:
  push:
    branches: [chore/multer-2-lockfile]
    paths: [.github/workflows/lockfile-once.yml]

permissions:
  contents: write

jobs:
  lockfile:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Abhängigkeiten aktualisieren
        run: |
          npm install multer@^2
          npm install @google/genai
          npm uninstall firebase
          npm ls multer @google/genai --depth=0
      - name: Tests
        run: npm test
      - name: Build
        run: npm run build
      - name: Ergebnis committen
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "multer 2.x, package-lock.json, @google/genai fest, firebase-Client entfernt (per CI erzeugt)"
          git push
