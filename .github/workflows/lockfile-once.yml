# Einmaliger Helfer: in der Entwicklungsumgebung ist die npm-Registry nicht erreichbar.
# Entfernt @google/genai, aktualisiert package-lock.json, prüft und committet auf diesen Branch.
# Wird im nächsten Commit wieder entfernt.
name: Lockfile einmalig erzeugen

on:
  push:
    branches: [claude/sprachdienste-umstieg]
    paths: [.github/workflows/lockfile-once.yml]

permissions:
  contents: write

jobs:
  lockfile:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Gemini-Abhängigkeit entfernen
        run: |
          npm uninstall @google/genai
          if grep -q '@google/genai' package.json package-lock.json; then echo "genai noch vorhanden"; exit 1; fi
      - name: Tests
        run: npm test
      - name: Build
        run: npm run build
      - name: Ergebnis committen
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "@google/genai entfernt, package-lock.json aktualisiert (per CI erzeugt)"
          git push
