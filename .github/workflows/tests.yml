name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # Nur das Nötige: Whisper, Piper und das Sprachmodell werden in den Tests durch Fakes ersetzt.
      - name: Abhängigkeiten
        run: pip install fastapi "uvicorn[standard]" python-multipart numpy httpx
      - name: Pi-Client
        working-directory: pi-client
        run: python -m unittest discover -s tests -v
      - name: Server (inkl. Ende-zu-Ende mit dem Pi-Client)
        working-directory: server
        run: python -m unittest discover -s tests -v
