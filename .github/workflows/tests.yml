name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: npm ci || npm install
      - name: Tests
        run: npm test
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Pi-Client-Tests
        run: python -m unittest discover -s pi-client -p "test_*.py"
      - name: Build & Typecheck
        run: npm run build
